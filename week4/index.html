<!DOCTYPE html>
<html>
<head>
    <title>Tech Club - Home</title>
</head>
<body>

    <h1>Welcome to Tech Club</h1>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">

        <br><br>
        

<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone">

<br><br>

<label for="date">Date of Birth:</label>
<input type="date" id="date" name="date">

<br><br>

<p>Gender:</p>

<input type="radio" id="male" name="gender" value="Male">
<label for="male">Male</label>

<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label>

<br><br>

<p>Areas of Interest:</p>

<input type="checkbox" id="coding" name="interest" value="Coding">
<label for="coding">Coding</label>

<input type="checkbox" id="design" name="interest" value="Design">
<label for="design">Design</label>

<input type="checkbox" id="robotics" name="interest" value="Robotics">
<label for="robotics">Robotics</label>

<br><br>

<label for="course">Choose Course:</label>

<select id="course" name="course">
    <option value="web">Web Development</option>
    <option value="java">Java Programming</option>
    <option value="ai">Artificial Intelligence</option>
</select>

<br><br>

<label for="message">Why do you want to join?</label>
<br>

<textarea id="message" name="message" rows="4" cols="30"></textarea>

<br><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
